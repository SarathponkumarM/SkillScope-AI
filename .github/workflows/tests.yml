name: SkillScope tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest -v test_prototype.py test_rag_pipeline.py test_v3_features.py
      - name: Run retrieval benchmark
        run: python evaluate_retrieval.py
